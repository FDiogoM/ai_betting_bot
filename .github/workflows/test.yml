name: tests

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 18 is the floor the setup scripts enforce; 22 is what a current
        # machine runs. Both, so neither the floor nor the ceiling rots.
        node: ['18', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json

      # No API key and no network: every provider response in the suite is
      # stubbed with nock. A test that needed a live call would fail here,
      # which is the point.
      - run: npm ci
        working-directory: mcp-server

      - run: npm test
        working-directory: mcp-server
